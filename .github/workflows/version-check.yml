name: Version check

# Refuse a change whose declared version disagrees with what it did to the public
# contract. The contract of this package is the set of commands and names it
# advertises — the runners you reach with `python -m`, the shell script it ships, the
# plugin names it declares, and the helpers it re-exports — so adding one is a
# capability and removing or renaming one breaks whoever invoked it yesterday.
#
# The rule itself lives in one place for the whole fleet and is not copied here:
# https://github.com/lbartoszcze/AutoVersion. This workflow supplies only the two
# things this repository alone knows: its surface, and the version it declares.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the shared rule
        # Into a virtual environment, never the system interpreter. ubuntu-latest now
        # resolves to an Ubuntu whose system python3 carries the externally-managed
        # marker, so a bare `pip install` dies with
        # error: externally-managed-environment before any check runs — a gate that can
        # never pass, worth exactly what one that can never fail is worth. The venv
        # sidesteps the marker without --break-system-packages, and putting its bin on
        # GITHUB_PATH leaves every later step's `autoversion` call unchanged. This
        # repository's own scripts stay on the system python3, which is right: they
        # import the stdlib and nothing else.
        run: |
          : "${RUNNER_TEMP:=$(mktemp -d)}"
          : "${GITHUB_PATH:=$(mktemp)}"
          python3 -m venv "$RUNNER_TEMP/rule"
          "$RUNNER_TEMP/rule/bin/python" -m pip install --quiet \
            "git+https://github.com/lbartoszcze/AutoVersion@v0.1.0"
          echo "$RUNNER_TEMP/rule/bin" >> "$GITHUB_PATH"
          # GITHUB_PATH is read by the runner after this step exits, so it does nothing
          # for the assertions below. Without this prepend they resolve whatever
          # `autoversion` PATH already held: command-not-found on a clean runner, so
          # permanently red — or a stranger's binary, which passes and vouches for a
          # rule nobody consulted. Measured both ways. This is the same prepend
          # GITHUB_PATH gives the later steps, applied to this one too.
          export PATH="$RUNNER_TEMP/rule/bin:$PATH"
          # `--help` is satisfied by ANY executable that exits zero, so establish WHICH
          # autoversion is about to answer before believing it. Should the prepend above
          # ever be lost in a later edit, this refuses and names the stranger, instead of
          # going green on a stranger's answer where nobody would look.
          resolved="$(command -v autoversion || true)"
          case "$resolved" in
            "$RUNNER_TEMP/rule/bin/"*) ;;
            *)
              echo "::error::autoversion resolves to '${resolved:-nothing}', outside the" \
                "venv this step just built, so nothing it answers would be the rule."
              false
              ;;
          esac
          autoversion --help > /dev/null || { echo "::error::the rule does not answer"; false; }

      - name: Read the public surface
        # No package dependencies: the surface is read from the sources with ast, so
        # this stays cheap and cannot be broken by an unrelated dependency. A module
        # that does not parse fails the step rather than silently shrinking the
        # surface.
        run: python3 scripts/surface.py > "$RUNNER_TEMP/candidate.json"

      - name: Compare against the released contract
        run: |
          set -euo pipefail
          released="$(jq -r .version released-surface.json)"
          declared="$(awk -F'"' '/version=/{print $2; exit}' setup.py)"
          echo "released: $released"
          echo "declared: $declared"

          # Before any verdict is consumed, make this step prove that what answers to
          # `autoversion` is the rule and that this gate CAN refuse. A gate that has never
          # refused is decoration, and the liveness assertion in the install step does not
          # close that: an impostor answering a constant `internal` passes `--help` and then
          # passes every step here, because when declared equals released `internal` IS the
          # passing branch — a fabricated verdict leaving no trace. Three known answers
          # close it, and no constant satisfies all three: a name removed reads `breaking`,
          # a name added reads `additive`, the released surface against itself reads
          # `internal`. `breaking` is by construction not `internal`, which is exactly the
          # condition refused on below, so the refusal branch is proven reachable rather
          # than assumed. Built from the committed baseline, not from a synthetic pair, so
          # the same step also shows the frozen file is the one reaching the decision. And
          # it lives in the SAME step as the decide it certifies, so it covers the binary
          # that actually answers here; in its own step it could be reordered or made
          # conditional and quietly stop covering anything. The removal probe keeps a
          # non-empty candidate deliberately — the rule rejects an empty surface outright,
          # so an empty one is not a usable known answer.
          jq '.surface = (.surface - [(.surface | sort | first)])' released-surface.json \
            > "$RUNNER_TEMP/one-removed.json"
          jq '.surface = (.surface + ["refusal-self-test:a-name-no-release-ever-had"])' \
            released-surface.json > "$RUNNER_TEMP/one-added.json"

          # The rule's exit status is tested explicitly, and nothing here reads a verdict
          # out of a command substitution containing a pipeline, where the status would be
          # discarded and a dead rule would read as an empty answer.
          assert_change() {
            autoversion decide --current "$released" \
              --published-surface released-surface.json \
              --candidate-surface "$candidate" --json > "$RUNNER_TEMP/probe.json" || {
                echo "::error::the rule failed on $candidate, so its verdict is unknown"
                false
              }
            change="$(jq -r .change "$RUNNER_TEMP/probe.json")"
            if [ "$change" != "$want" ]; then
              echo "::error::what answers to autoversion called $candidate '$change'" \
                "instead of '$want', so it is not the rule and its verdict about the real" \
                "candidate means nothing."
              false
            fi
            echo "$candidate reads as $want, as the rule requires."
          }

          candidate="$RUNNER_TEMP/one-removed.json"; want=breaking; assert_change
          candidate="$RUNNER_TEMP/one-added.json"; want=additive; assert_change
          candidate=released-surface.json; want=internal; assert_change

          verdict="$(autoversion decide \
            --current "$released" \
            --published-surface released-surface.json \
            --candidate-surface "$RUNNER_TEMP/candidate.json" \
            --json)"
          echo "$verdict"

          change="$(printf '%s' "$verdict" | jq -r .change)"
          required="$(printf '%s' "$verdict" | jq -r .next)"

          if [ "$declared" = "$released" ]; then
            if [ "$change" != "internal" ]; then
              echo "::error::The public contract changed ($change) but setup.py still" \
                "declares the released version $released. The next version must be $required."
              false
            fi
            echo "Nothing released yet and the contract is unchanged."
          elif [ "$declared" != "$required" ]; then
            echo "::error::setup.py declares $declared, but a $change change to" \
              "$released requires $required."
            false
          else
            echo "Declared version matches the $change change."
          fi

      - name: Refuse a baseline that misdescribes itself
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          # released-surface.json must describe something a user can actually get, and
          # it says which kind of thing in the first token of its "source" field. That
          # marker is the coupling between the two files — a constant, not prose — and
          # scripts/baseline.py writes it from its MARKER constant. Two honest states
          # exist, and this pins the baseline to whichever one is true: a version the
          # registry serves, whose surface came from that version's artefact, or no
          # release at all, in which case the baseline is a tag or HEAD and must say so.
          # A baseline claiming a release nobody can install, or claiming there is no
          # release when PyPI serves one, makes every later comparison measure against
          # a thing that is not what anybody installed.
          project="$(awk -F'"' '/name=/{print $2; exit}' setup.py)"
          baseline_version="$(jq -r .version released-surface.json)"
          marker="$(jq -r '.source | split(" ") | first' released-surface.json)"
          echo "project: $project"
          echo "baseline: $baseline_version"
          echo "marker: $marker"

          # Which registry a marker is a claim ABOUT decides what can refute it. Lumping
          # every non-PyPI tier into "claims no registry" would test a stado: marker by
          # asking PyPI about it, which is not the claim the marker makes. Refuting a
          # Stado claim takes `stado storage objects releases <product>`, or `stado
          # storage stat` given a full stado:// URI — that spelling is namespace-aware and
          # distinguishes present from absent from unreachable, whereas a bare path is read
          # as a raw queue-store key and reports absence for objects that exist, and
          # `stado storage ls` is wrong for product objects in either spelling
          # (GrantCli's finding, as corrected by StadoSelf). wisent-tools is distributed
          # through PyPI alone, so a stado: baseline is not a tier this project can be
          # on — refused as unsupported rather than misfiled as unpublished.
          case "$marker" in
            pypi-*) claims_registry=yes ;;
            git-archive:*|head:*) claims_registry=no ;;
            stado:*)
              echo "::error::the baseline claims $marker, but wisent-tools is distributed" \
                "through PyPI, not a Stado channel. Asserting its absence from PyPI would" \
                "not test that claim. Run: python3 scripts/baseline.py"
              false
              ;;
            *)
              echo "::error::unknown baseline marker: $marker. Expected one of" \
                "pypi-sdist:, pypi-wheel:, git-archive:, head:."
              false
              ;;
          esac

          if [ "$claims_registry" = yes ]; then
            # Forward: that exact version must be served.
            if ! version_json="$(curl -sSf "https://pypi.org/pypi/$project/$baseline_version/json")"; then
              echo "::error::the baseline claims $marker, but PyPI does not serve" \
                "$project $baseline_version. Run: python3 scripts/baseline.py"
              false
            fi

            # And that exact artefact. The tail of the marker is a filename, so a
            # hand-edited baseline can name the right kind of artefact from the wrong
            # release while the version beside it stays perfectly serveable — right
            # tier, wrong file, every assertion around it satisfied.
            artifact="${marker#*:}"
            if ! printf '%s' "$version_json" \
              | jq -e --arg f "$artifact" 'any(.urls[]; .filename == $f)' >/dev/null; then
              echo "::error::the baseline marker names $artifact, which is not an" \
                "artefact PyPI serves for $project $baseline_version." \
                "Run: python3 scripts/baseline.py"
              false
            fi

            # Being honest about the tier is not the same as being on the newest
            # artefact of it. A release published after the baseline was generated
            # leaves everything above still true — the file names a version PyPI really
            # serves — while the gate quietly goes on measuring against a superseded
            # sdist, so a capability dropped in that release reads as unchanged forever.
            # Which of two versions is newer is the shared rule's judgement, not a
            # string comparison belonging here. No tier-reachability check follows:
            # pypi-sdist is the top tier, so once the baseline is the newest version
            # served there is nothing better to move to.
            latest="$(curl -sSf "https://pypi.org/pypi/$project/json" | jq -r .info.version)"
            superseded="$(autoversion order --older "$baseline_version" --newer "$latest" --json | jq -r .is_newer)"
            if [ "$superseded" = True ]; then
              echo "::error::the baseline is $project $baseline_version, but PyPI now" \
                "serves $latest, so every comparison measures against a superseded" \
                "release. Run: python3 scripts/baseline.py"
              false
            fi
            echo "Baseline $baseline_version is the newest release PyPI serves, recovered from $marker."
          else
            # Reverse: claiming no release means the registry must not have the project
            # at all. Otherwise the baseline is dodging a real release.
            #
            # This is the one assertion here whose answer is a NEGATIVE, so it reads the
            # answer's CONTENT and never curl's exit status. Under -sSf a rate limit, an
            # error page and a permission refusal all fail exactly like not-found, so
            # transport success is the wrong question — and a positive control on a
            # project that certainly exists does not fix it either, because it proves the
            # index is reachable, not that this project's endpoint answered. A refusal to
            # authorize is a successful request whose body means nothing. PyPI states
            # absence in words, so demand that testimony and treat anything else as no
            # answer. Three outcomes, not two: named, stated-absent, unproven. Credit
            # AgentGateway and Ultrareach for the residual the control missed, and OneB
            # for the primitive.
            #
            # `|| true` is safe here only because both passing paths demand specific
            # content and the fallthrough refuses; it must never be lifted into a check
            # that reads an empty answer as agreement.
            answer="$(curl -s "https://pypi.org/pypi/$project/json" || true)"
            if printf '%s' "$answer" | jq -e '.info.name' >/dev/null; then
              echo "::error::the baseline claims $marker, but PyPI names $project," \
                "so a published artefact exists and must be the baseline." \
                "Run: python3 scripts/baseline.py"
              false
            elif ! printf '%s' "$answer" \
              | jq -e '(.message // "") | ascii_downcase | contains("not found")' >/dev/null; then
              echo "::error::PyPI did not answer about $project — no stated absence, so" \
                "the claim in $marker is unproven. Refusing rather than assuming it is" \
                "unpublished."
              false
            fi
            echo "PyPI states $project is not there, and the baseline says so."
          fi
